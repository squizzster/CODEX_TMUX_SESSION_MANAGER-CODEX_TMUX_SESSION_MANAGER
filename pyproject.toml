[project]
name = "codex-tmux-session-manager"
version = "0.4.0"
description = "Manage durable Rodex identities and Codex CLI sessions"
readme = "README.md"
authors = [
    { name = "Mark", email = "squizzster@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Operating System :: POSIX",
]
dependencies = [
    "codex-protocol-log-analyzer @ git+https://github.com/squizzster/CODEX_PROTOCOL_LOG_ANALYZER-CODEX_PROTOCOL_LOG_ANALYZER.git@781d8e7a6820b119a37fe3e906380c8b47e38dfa",
    "coolname>=5.0.0",
    "websockets>=15,<18",
]

[project.scripts]
ctsm = "codex_tmux_session_manager:main"
rodex = "rodex:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["codex_tmux_session_manager", "cool_name", "rodex", "rodex_functions", "rodex_sql"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv.build-backend]
module-name = [
    "codex_tmux_session_manager",
    "cool_name",
    "rodex",
    "rodex_functions",
    "rodex_sql",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
