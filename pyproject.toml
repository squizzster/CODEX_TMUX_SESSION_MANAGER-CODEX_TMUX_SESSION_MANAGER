[project]
name = "codex-tmux-session-manager"
version = "0.5.0a1"
description = "Durable Codex sessions bridging native tmux use and exact local automation"
readme = "README.md"
authors = [
    { name = "Mark", email = "squizzster@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "codex-protocol-log-analyzer @ git+https://github.com/squizzster/CODEX_PROTOCOL_LOG_ANALYZER-CODEX_PROTOCOL_LOG_ANALYZER.git@13d23b296222e40c18cfc3b45d02c2adef45cce2",
    "coolname>=5.0.0",
    "websockets>=15,<18",
]

[project.scripts]
rodex = "rodex:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "evolutionary_regression: guards a production fix based on current best evidence; deliberately replace it when broader evidence supersedes the model",
]

[tool.coverage.run]
branch = true
source = ["cool_name", "rodex", "rodex_registry", "rodex_sql"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.uv.build-backend]
module-name = [
    "codex_cli_contract",
    "cool_name",
    "rodex",
    "rodex_registry",
    "rodex_sql",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
